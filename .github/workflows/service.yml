name: 业务服务验证

on:
  push:
    branches: [master, "codex/**"]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quickmirror_test
          POSTGRES_PASSWORD: quickmirror_test_only
          POSTGRES_DB: quickmirror_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickmirror_test -d quickmirror_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QM_TEST_DATABASE_URL: postgres://quickmirror_test:quickmirror_test_only@localhost:5432/quickmirror_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race -tags integration ./internal/catalog ./internal/bootstrap
