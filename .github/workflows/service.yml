name: 业务服务验证

on:
  push:
    branches: ["master", "qm-app", "codex/**"]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go test -run '^$' -tags runtimeintegration ./cmd/quick-mirror-service
      - name: 构建服务验证产物
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=".exe"
          fi
          mkdir -p dist
          go build -trimpath -o "dist/quick-mirror-service${suffix}" ./cmd/quick-mirror-service
      - uses: actions/upload-artifact@v4
        with:
          name: quick-mirror-service-${{ matrix.os }}
          path: dist/*
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quickmirror_test
          POSTGRES_PASSWORD: quickmirror_test_only
          POSTGRES_DB: quickmirror_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickmirror_test -d quickmirror_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QM_TEST_DATABASE_URL: postgres://quickmirror_test:quickmirror_test_only@localhost:5432/quickmirror_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: python3 scripts/validate-openapi.py
      - run: go test -race -tags integration ./internal/catalog ./internal/bootstrap ./internal/binding ./internal/httpapi ./internal/control ./internal/peerloom

      - name: Checkout pinned Peerloom management runtime fixture source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: barry-ran/peerloom
          ref: 510bc0e40cc233c58eac18a43db0b58b2ecd5c45
          path: .ci-peerloom
          persist-credentials: false
          submodules: false
      - name: Real Peerloom TLS management and QM credential worker
        timeout-minutes: 8
        run: python3 scripts/test-peerloom-renewal-runtime.py --peerloom .ci-peerloom --commit 510bc0e40cc233c58eac18a43db0b58b2ecd5c45
